<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel TV 55" — Power BI</title>
    <style>
        :root {
            /* Resolução LÓGICA em que o Power BI vai renderizar.
               Deve ser IGUAL ao tamanho da página configurado no relatório
               (Formatar página > Tamanho da tela). */
            --canvas-w: 1920;
            --canvas-h: 1080;

            /* Compensação de overscan da TV (alguns modelos cortam a borda).
               0 = desligado. Use 1.02 ou 1.03 se as bordas sumirem. */
            --overscan: 1;

            /* Corte da barra inferior do Power BI (navegação de páginas /
               status do workspace), em px do canvas lógico.
               Calibre em tempo real com as teclas + e - . */
            --corte-rodape: 72px;

            /* Corte da barra de rolagem lateral, se aparecer. */
            --corte-lateral: 0px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Palco: ocupa a TV inteira e centraliza o canvas escalado */
        .tela {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            opacity: 0;
            z-index: 0;
            pointer-events: none;
            transition: opacity .4s ease-in-out;
        }
        .tela.active { opacity: 1; z-index: 1; pointer-events: auto; }

        /* Canvas com tamanho FIXO em px. O Power BI sempre mede 1920x1080,
           independente da resolução real da TV — é isso que impede o
           redimensionamento do relatório. O CSS escala depois. */
        .canvas {
            position: relative;
            width: calc(var(--canvas-w) * 1px);
            height: calc(var(--canvas-h) * 1px);
            flex: 0 0 auto;
            transform-origin: center center;
            overflow: hidden;
        }

        .canvas iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% + var(--corte-lateral));
            height: calc(100% + var(--corte-rodape));
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="aviso" style="position:fixed;bottom:12px;left:12px;z-index:99;
         font:14px/1 monospace;color:#fff;background:rgba(0,0,0,.75);
         padding:8px 12px;border-radius:4px;opacity:0;transition:opacity .2s;
         pointer-events:none">--corte-rodape</div>

    <!-- URLs terminando em:
         &chromeless=1&navContentPaneEnabled=false&pageView=actualSize
         data-tempo = segundos visíveis -->

    <div class="tela active" data-tempo="30">
        <div class="canvas">
            <iframe src="https://app.powerbi.com/groups/b1bc901a-4798-4595-85d5-cfab39dbab06/reports/e5936887-3018-4a88-9eb2-5ff124d2ccb1/ReportSection01bc26ca605e31b49c40?ctid=56eda749-b95e-4a74-93de-f01fd6b161cc&experience=power-bi&bookmarkGuid=Bookmarke0995f9e700d6c32dee0&chromeless=1&navContentPaneEnabled=false&pageView=actualSize"></iframe>
        </div>
    </div>

    <div class="tela" data-tempo="30">
        <div class="canvas">
            <iframe src="https://app.powerbi.com/groups/b1bc901a-4798-4595-85d5-cfab39dbab06/reports/e5936887-3018-4a88-9eb2-5ff124d2ccb1/a56c1f1ad7043854268a?ctid=56eda749-b95e-4a74-93de-f01fd6b161cc&experience=power-bi&bookmarkGuid=a0c7250c9e29f942ebc2&chromeless=1&navContentPaneEnabled=false&pageView=actualSize"></iframe>
        </div>
    </div>

    <div class="tela" data-tempo="30">
        <div class="canvas">
            <iframe src="https://app.powerbi.com/groups/d0649602-6d4b-4517-ba0d-c273b2fc2d44/reports/b9dfe7d0-c017-4854-a475-335018a65480/d7d1397f37312b5b1eec?ctid=56eda749-b95e-4a74-93de-f01fd6b161cc&experience=power-bi&chromeless=1&navContentPaneEnabled=false&pageView=actualSize"></iframe>
        </div>
    </div>

    <script>
    (function () {
        const TEMPO_PADRAO       = 30;          // segundos
        const INTERVALO_REFRESH  = 15 * 60;     // segundos
        const MODO               = 'cover';     // 'cover' = preenche tudo (pode cortar milímetros)
                                                // 'contain' = mostra tudo (pode deixar barra preta)

        const raiz    = getComputedStyle(document.documentElement);
        const CANVAS_W = parseFloat(raiz.getPropertyValue('--canvas-w'));
        const CANVAS_H = parseFloat(raiz.getPropertyValue('--canvas-h'));
        const OVERSCAN = parseFloat(raiz.getPropertyValue('--overscan')) || 1;

        const telas = Array.from(document.querySelectorAll('.tela'));
        let indexAtual = 0;

        telas.forEach(t => {
            const f = t.querySelector('iframe');
            f.dataset.urlOriginal   = f.src;
            f.dataset.ultimoRefresh = Date.now();
        });

        // Calcula a escala para o canvas 1920x1080 caber/preencher a TV
        function escalar() {
            const sx = window.innerWidth  / CANVAS_W;
            const sy = window.innerHeight / CANVAS_H;
            const s  = (MODO === 'cover' ? Math.max(sx, sy) : Math.min(sx, sy)) * OVERSCAN;
            document.querySelectorAll('.canvas').forEach(c => {
                c.style.transform = 'scale(' + s + ')';
            });
        }

        function segundos(tela) {
            const v = parseInt(tela.dataset.tempo, 10);
            return (isNaN(v) || v <= 0 ? TEMPO_PADRAO : v) * 1000;
        }

        function refreshSeNecessario(tela) {
            const f = tela.querySelector('iframe');
            if (Date.now() - Number(f.dataset.ultimoRefresh) >= INTERVALO_REFRESH * 1000) {
                f.src = f.dataset.urlOriginal;
                f.dataset.ultimoRefresh = Date.now();
            }
        }

        function proxima() {
            const anterior = telas[indexAtual];
            anterior.classList.remove('active');

            indexAtual = (indexAtual + 1) % telas.length;
            const atual = telas[indexAtual];
            atual.classList.add('active');

            setTimeout(() => refreshSeNecessario(anterior), 1000);
            setTimeout(proxima, segundos(atual));
        }

        // ---- Calibração do rodapé -------------------------------------
        // Com a página em foco: "+" corta mais, "-" corta menos, "C" mostra
        // o valor atual. Quando o rodapé sumir, copie o valor para o CSS.
        let corte = parseFloat(raiz.getPropertyValue('--corte-rodape')) || 72;
        function aplicarCorte(v) {
            corte = Math.max(0, v);
            document.documentElement.style.setProperty('--corte-rodape', corte + 'px');
            const aviso = document.getElementById('aviso');
            aviso.textContent = '--corte-rodape: ' + corte + 'px';
            aviso.style.opacity = 1;
            clearTimeout(aviso._t);
            aviso._t = setTimeout(() => { aviso.style.opacity = 0; }, 2000);
        }
        document.addEventListener('keydown', e => {
            if (e.key === '+' || e.key === '=') aplicarCorte(corte + 4);
            if (e.key === '-' || e.key === '_') aplicarCorte(corte - 4);
            if (e.key.toLowerCase() === 'c')     aplicarCorte(corte);
        });
        // ---------------------------------------------------------------

        window.addEventListener('resize', escalar);
        window.addEventListener('load', () => {
            escalar();
            setTimeout(proxima, segundos(telas[0]));
        });
        escalar();
    })();
    </script>
</body>
</html>
